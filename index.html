<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ISATab Viewer - Development</title>
</head>
<body>

<div id="investigation_file" class="isa-view">
  <div class="toolbar">
    <hr/>
    <p>
      <span>
        <a href="https://github.com/ISA-tools/ISATab-Viewer">ISATab-Viewer</a> - Part of
        <a href="http://www.isa-tools.org">
          <img src="isaviewer_assets/img/isa_footer_logo.svg" alt="ISA-tools" height="20" width="70">
        </a>
        Developed and maintained by <a href="http://www.isa-tools.org/team/">the ISA-tools Team</a>
      </span>
    </p>
    <hr/>

    <div style="margin-top: 10px;">
      <label><strong>Select Dataset:</strong></label>
      <select id="dataset-selector" style="margin-left: 10px; padding: 5px;">
        <option value="test_data_sets/PXD017710/i_PXD017710.txt">PXD017710 - SARS-CoV-2 proteomics</option>
        <option value="test_data_sets/BII-S-3/i_gilbert.txt">BII-S-3 - Yeast nutrient limitations</option>
        <option value="test_data_sets/BII-I-1/i_Investigation.txt">BII-I-1 - Bacterial metabolism</option>
      </select>
      <button class="btn btn-green" onclick="loadSelectedDataset()" style="margin-left: 10px;">Load</button>
    </div>
  </div>

  <div class="isa-study-list" id="study-list-panel">
    <h3>STUDIES</h3>
    <ul id="study-list"></ul>
  </div>
  <div class="isa-resize-handle" id="resize-handle"></div>
  <div class="isa-main-view" id="main-view-panel">
    <div class="isa-breadcrumbs">
      <ul id="isa-breadcrumb-items"></ul>
    </div>
    <div class="cf"></div>
    <div id="study-info"></div>
  </div>
</div>

<!-- Investigation Template -->
<script id="investigation-template" type="text/x-handlebars-template">
  <div id="investigation-title">{{investigation_title}}</div>
  <div id="investigation-description">{{investigation_description}}</div>
  <div class="cf"></div>
  <br/>
  <div id="investigation-contacts">
    <span class="section-header">Contacts</span>
    <ul>
      {{#each contacts}}
      <li>
        <p>{{[Investigation Person First Name]}} {{[Investigation Person Last Name]}}</p>
        <p>{{[Investigation Person Affiliation]}}</p>
      </li>
      {{/each}}
    </ul>
  </div>
  <div id="investigation-publications">
    <span class="section-header">Publications</span>
    <ul>
      {{#each publications}}
      <li>
        <p>{{[Investigation Publication Title]}}</p>
      </li>
      {{/each}}
    </ul>
  </div>
</script>

<!-- Study List Template -->
<script id="study-list-template" type="text/x-handlebars-template">
  <ul>
    {{#each studies}}
    <li id="list-{{this.hash}}" onclick="ISATabViewer.rendering.render_study('{{this.id}}', '{{this.hash}}')">
      {{this.id}}
    </li>
    {{/each}}
  </ul>
</script>

<!-- Table Template -->
<script id="table-template" type="text/x-handlebars-template">
  <table class="isa-table">
    <thead>
      <tr>
        {{#each headers}}
        <th>{{this}}</th>
        {{/each}}
      </tr>
    </thead>
    <tbody>
      {{#each rows}}
      <tr>
        {{#each columns}}
        <td>{{this}}</td>
        {{/each}}
      </tr>
      {{/each}}
    </tbody>
  </table>
</script>

<!-- Sample Distribution Template -->
<script id="sample-distribution-template" type="text/x-handlebars-template">
  <ul id="sample_stats">
    {{#each sample_stats}}
    <li>
      <p class="characteristic_type">{{name}}</p>
      {{#each distribution}}
      <div class="distribution-group">
        <div class="distribution">{{name}}</div>
        <div class="distribution-value"><span>{{value}}</span></div>
      </div>
      <div class="cf"></div>
      {{/each}}
    </li>
    {{/each}}
  </ul>
</script>

<!-- Study Template - Restored from original design -->
<script id="study-template" type="text/x-handlebars-template">
  <div id="study-id">{{study_id_display}}</div>
  <div id="study-title">{{study_title}}</div>
  <div id="study-description">{{study_description}}</div>
  <div class="cf"></div>

  <div id="samples">
    <span class="section-header">Samples</span>
    <div class="cf"></div>
    <br/><br/>
    <button class="btn btn-green" onclick="ISATabViewer.rendering.render_assay('{{study_id}}','{{study_id_hash}}','{{study_file}}')">
      View Samples
    </button>
    <br/>
    <div id="sample-distribution">
      {{#if sample_stats}}
      <ul id="sample_stats">
        {{#each sample_stats}}
        <li>
          <p class="characteristic_type">{{name}}</p>
          {{#each distribution}}
          <div class="distribution-group">
            <div class="distribution">{{name}}</div>
            <div class="distribution-value"><span>{{value}}</span></div>
          </div>
          <div class="cf"></div>
          {{/each}}
        </li>
        {{/each}}
      </ul>
      {{/if}}
    </div>
  </div>

  <div id="assays">
    <span class="section-header">Assays</span>
    <ul>
      {{#each assays}}
      <li>
        <div class="assay-icon {{icon}}"></div>
        <p class="measurement-type">{{[Study Assay Measurement Type]}}</p>
        <p class="technology-type">{{[Study Assay Technology Type]}}</p>
        <p class="technology-platform">{{[Study Assay Technology Platform]}}</p>
        <p class="assay-file-name">{{[Study Assay File Name]}}</p>
        <button class="btn btn-green" onclick="ISATabViewer.rendering.render_assay('{{../study_id}}','{{../study_id_hash}}','{{[Study Assay File Name]}}')">
          View
        </button>
      </li>
      {{/each}}
    </ul>
  </div>

  <div class="cf"></div>
  <br/><br/>

  <div id="publications">
    <span class="section-header">Publications</span>
    <ul>
      {{#each publications}}
      <li>
        <p class="publication-title">{{[Study Publication Title]}}</p>
        <p class="publication-authors">{{[Study Publication Author List]}}</p>
        <p class="publication-pubmedid">Pubmed ID: {{[Study PubMed ID]}}</p>
        {{#if [Study Publication DOI]}}
        <p class="publication-doi">DOI: <a href="https://doi.org/{{[Study Publication DOI]}}">{{[Study Publication DOI]}}</a></p>
        {{/if}}
      </li>
      {{/each}}
    </ul>
  </div>

  <div id="protocols">
    <span class="section-header">Protocols</span>
    <ul>
      {{#each protocols}}
      <li>
        <p class="protocol-name">{{[Study Protocol Name]}} ({{[Study Protocol Type]}})</p>
        <p class="protocol-description">{{[Study Protocol Description]}}</p>
      </li>
      {{/each}}
    </ul>
  </div>

  <div id="factors">
    <span class="section-header">Factors</span>
    <ul>
      {{#each factors}}
      <li>
        <p class="protocol-name">{{[Study Factor Name]}} ({{[Study Factor Type]}})</p>
      </li>
      {{/each}}
    </ul>
  </div>

  <div id="contacts">
    <span class="section-header">Contacts</span>
    <ul>
      {{#each contacts}}
      <li>
        <p class="contact-name">{{[Study Person First Name]}} {{[Study Person Last Name]}}</p>
        <p class="contact-affiliation">{{[Study Person Affiliation]}}</p>
      </li>
      {{/each}}
    </ul>
  </div>
</script>

<script type="module" src="/src/main.js"></script>

</body>
</html>
